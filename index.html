<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="description" content="Street Bazar - Modern marketplace platform with AI-powered stores, smart product recommendations, and real-time order tracking." />
    <title>Street Bazar - Apna Store Banao, AI Se Badhao</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Karla:wght@400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/styles.css" />
    <link rel="stylesheet" href="./assets/theme.css" />
  </head>
  <body>
    <div id="loader" class="loader">
  <div class="loader-bg-orb orb-1"></div>
  <div class="loader-bg-orb orb-2"></div>
  <div class="loader-bg-orb orb-3"></div>

  <div class="loader-inner">

    <div class="loader-logo-wrap">
      <div class="loader-ring"></div>
      <img
        src="./images/logo.png"
        alt="Street Bazar"
        class="loader-logo"
      />
    </div>

    <div class="loader-brand">
      <span class="loader-word loader-street">Street</span>
      <span class="loader-word loader-bazar">Bazar</span>
    </div>

    <div class="loader-tagline">
      <span>APNA BAZAAR</span>
      <i></i>
      <span>APNI DUKAN</span>
    </div>

    <div class="loader-progress">
      <div class="loader-progress-bar"></div>
    </div>

    <div class="loader-loading">
      <span>Loading Street Bazar</span>
      <span class="loader-dots">
        <i></i><i></i><i></i>
      </span>
    </div>

  </div>
</div>

<div id="scroll-progress"></div>

    <div id="app" class="app is-booting">
      <header id="site-header"></header>
      <main id="view" class="view"></main>
      <footer id="site-footer"></footer>
      <nav id="mobile-nav"></nav>
    </div>

    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <div id="modal-root"></div>
    <div id="fx-root"></div>

    <script type="module" src="./assets/js/main.js"></script>
  </body>
</html>
